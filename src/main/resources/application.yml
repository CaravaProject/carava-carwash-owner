spring:
  application:
    name: carava-carwash-owner

  datasource:
    url: jdbc:postgresql://localhost:5432/carvana
    username: carvana_admin
    password: Carvana2024!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
      password: carwash_redis_password
      timeout: 2000ms

server:
  port: 8081
  servlet:
    context-path: /api/owner

jwt:
  secret: carwash-owner-jwt-secret-key-for-carava-service-2024
  access-token-expire-time: 1800000 # 30분
  refresh-token-expire-time: 604800000 # 7일

logging:
  level:
    com.carava.carwash: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
